<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!--
    钢笔尖光标。热点在笔尖 (3,21)，与 motion.css 里的 cursor 声明对应。

    深墨填充 + 纸色描边：这样在亮底和暗底上都看得清，
    不必为暗色模式再准备一套光标（CSS 的 cursor 无法响应 data-theme 切换）。
  -->
  <g fill="#1f2a37" stroke="#fbf9f3" stroke-width="1.1" stroke-linejoin="round">
    <!-- 笔身：从右上到左下的锥形 -->
    <path d="M4.2 20.6 L7.6 17.2 L18.9 5.9 A1.4 1.4 0 0 0 18.9 3.9 L18.1 3.1 A1.4 1.4 0 0 0 16.1 3.1 L4.8 14.4 L1.4 17.8 Z" />
  </g>
  <!-- 中缝与气孔：让它读起来是"蘸水笔尖"而不是一支铅笔 -->
  <path d="M5.6 15.6 L8.4 18.4" stroke="#fbf9f3" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.85" />
  <circle cx="10.2" cy="13.8" r="1" fill="#fbf9f3" opacity="0.9" />
</svg>
