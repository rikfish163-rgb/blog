<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    站点图标。16px 下要能认出来，所以不用毛笔「泰」——那个尺寸会糊成一团。
    改用本站的三个构成要素抽象化：方格纸底 + 一道墨迹 + 一枚朱砂印。
    currentColor 不适用（favicon 无继承），颜色与 tokens.css 手工对齐。
  -->
  <rect width="32" height="32" rx="4" fill="#fbf9f3" />

  <!-- 方格：只画两条，多了在 16px 下变成噪点 -->
  <g stroke="#e6e1d5" stroke-width="1.5">
    <path d="M11 2 V30 M21 2 V30 M2 11 H30 M2 21 H30" />
  </g>

  <!-- 一道墨迹：中段饱满、两端收锋，和首页 hero 那道笔画同源 -->
  <path
    d="M5 22 C 10 17.5, 14 20, 19 15 C 22.5 11.5, 25 9.5, 27.5 8.5
       C 28.6 8.1, 29 9.4, 28 10 C 25.6 11.4, 23.4 13.4, 20.4 16.7
       C 15.4 22.2, 10.6 24.6, 5.4 23.6 C 4.4 23.4, 4.2 22.4, 5 22 Z"
    fill="#1f2a37"
  />

  <!-- 朱砂印：全站唯一的红，在图标里也只出现一次 -->
  <rect x="20" y="20" width="8" height="8" rx="1.5" fill="#c1362f" />
</svg>
